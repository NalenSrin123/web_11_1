<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    .box{
        width: 60%;
        margin: auto;
        margin-top: 80px;
        background-color: greenyellow;
        padding: 10px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(7,1fr);
    }
    .box-1{
        width: 100%;
        background-color: blue;
        height: 120px;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 20px;
        cursor: pointer;
    }
</style>
<body>
    <div class="group ms-5 mt-5">
        <button class="btn btn-primary" id="app">Append</button>
        <button class="btn btn-info" id="pre">Prepend</button>
        <button class="btn btn-warning" id="before">Before</button>
        <button class="btn btn-success" id="after">After</button>
        <button class="btn btn-danger">Remove</button>
    </div>
    <div class="box">
        <div class="box-1 before_after">Box</div>
    </div>
</body>
</html>
<script>
    $(document).ready(()=>{
        var i=1;
        $('#app').click(()=>{  
            $('.box').append(`<div class="box-1">${i}</div>`)
            i++;
        })
        $('#pre').click(()=>{  
            $('.box').prepend(`<div class="box-1">${i}</div>`)
            i++;
        })
        $('#before').click(()=>{  
            $('.before_after').before(`<div class="box-1">${i}</div>`)
            i++;
        })
        $('#after').click(()=>{  
            $('.before_after').after(`<div class="box-1">${i}</div>`)
            i++;
        })
    })
</script>
