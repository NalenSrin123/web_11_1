<script type="module">
    import {products} from './data.js'
    $(document).ready(function(){
        
      
        
        function newProduct(){
            products.reverse()
           let product='';

            products.forEach((item)=>{

                    product+=` <div class="col-6 col-sm-6 col-xl-3" >

                                    <i class="bi bi-star-fill"></i>
                                    <i class="bi bi-star-fill"></i>

                        </div>
                    </div>

                    `;
                }else{
                    product+=`

                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }
                count++;
                }
            })  
            $('#new').html(product) 
        }
        newProduct();
        function promotion(){
            let product='';
            let count=1;
            products.forEach((item)=>{
                if(item.reqular_price!=0){
                    if(count<=4){
                        product+=`

                            </div>
                        </div>
                    </div>
                    `;
                    count++;
                    }
                    
                }
            })
