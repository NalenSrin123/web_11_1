<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="icon" href="https://i.pinimg.com/originals/84/9a/b7/849ab7bbab9a8d1e55854392af3b9d18.png">
    <title>Fashion-Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <header >
        <nav class="navbar navbar-expand-lg navbar-light bg-light ">
            <div class="container" >
                <a class="navbar-brand" href="#">
                    <img width="120px" height="80px" src="https://img.freepik.com/premium-vector/fashion-logo-template-design_278222-5475.jpg" alt="">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse " id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="#" id="home">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#" id="shop">Shop</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">News</a>
                    </li>
                    <li class="nav-item" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <a class="nav-link" href="#" >Contact</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                </div>
            </div>
        </nav>
    </header>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">FEEDBACK</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="">
                    <div class="group">
                        <div class="group-item">
                            <label for="" class="form-label">Name</label>
                            <input type="text" name="" id="" class="form-control w-100">
                        </div>
                        <div class="group-item">
                            <label for="" class="form-label">Email</label>
                            <input type="email" name="" id="" class="form-control w-100">
                        </div>
                        <div class="group-item">
                            <label for="" class="form-label">Phone Number</label>
                            <input type="text" name="" id="" class="form-control w-100">
                        </div>
                        <div class="group-item">
                            <label for="" class="form-label">Address</label>
                            <input type="text" name="" id="" class="form-control w-100">
                        </div>
                    
                        
                    </div>
                        <label for="" class="form-label">Description</label>
                       <textarea name="" id="" class="form-control"></textarea>

                </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary"><i class="bi bi-send me-2"></i>Send</button>
            </div>
          </div>
        </div>
      </div>
    <section>
        
    </section>
    <footer class="container-fluid mt-5 p-5">
        <div class="footer container">
            <div class="row">
                <div class="col-12 col-xl-3">
                    <div class="app">
                        <h5 class="text-start">ZANDO APP</h5>
                        <img width="100px" src="https://zandokh.com/image/catalog/logo/qr_code_app.png" alt="">
                    </div>
                </div>
                <div class="col-12 col-xl-3">
                    <div class="link">
                         <h5 class="text-start">FOLLOW US</h5>
                        <ul>
                            <li><a href=""><i class="bi bi-facebook me-1"></i> FaceBook</a></li>
                           <li><a href=""><i class="bi bi-instagram me-1"></i> Instagram</a></li>
                            <li><a href=""><i class="bi bi-tiktok me-1"></i>Tik Tok</a></li>
                            <li><a href=""><i class="bi bi-youtube me-1"></i> YouTube</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-12 col-xl-3">
                    
                    <div class="link">
                        <h5>CUSTOMER SERVICES</h5>
                        <ul>
                            <li><a href=""><i class="bi bi-question-circle me-1"></i>Online exchange policy</a></li>
                            <li><a href=""><i class="bi bi-shield-shaded me-1"></i>Privacy Policy</a></li>
                            <li><a href=""><i class="bi bi-whatsapp me-1"></i>FAQs & guides</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-12 col-xl-3">
                    <div class="accept">
                        <h5>WE ACCEPT</h5>
                        <img width="190px" src="https://zandokh.com/image/catalog/logo/web-footer/We-accept-payment%E2%80%93for-web-footer-1.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </footer> 
</body>
</html>
<script type="module">
    import {products} from './data.js'
    $(document).ready(function(){
        function page(link){
            $.ajax({
                url:link,
                cache:false,
                success:function(data){
                    $('section').html(data);
                }
            })
        }
        page('home.html');
        $('#home').click(function(){
            page('home.html');
        });
        $('#shop').click(function(){
            page('shop.html');
        });
        $(document).on('click','.cards',function(){
            var id=$(this).attr('data-id');
            let product=products.find(item=>item.id==id);
            $('section').html(`
                <div class="container mt-3">
            <h1 class="text-center">Product Detail</h1>
            <div class="row">
                <div class="col-xl-4 col-6">
                    <img class="w-100" src="${product.image}" alt="">
                </div>
                <div class="col-xl-8 col-6 ">
                    <div class="detail">
                        <h2>Name</h2>
                        <h4 class="ms-3">${product.title}</h4>
                        <h2>Price</h2>
                        <h4 >$${product.sale_price}</h4>
                        <h2>Category</h2>
                        <h4 class="ms-3">${product.category}</h4>
                        <h2>Size</h2>
                        <h4 class="ms-3">${product.size}</h4>
                        <h2>Color</h2>
                        <h4 class="ms-3">${product.color}</h4>
                        <h2>Description</h2>
                        <h4 class="ms-3">${product.description}</h4>
                        <button class="btn btn-primary">Buy Now</button>
                    </div>
                </div>
            </div>
        </div>
            `); 
        })
    });
</script>
